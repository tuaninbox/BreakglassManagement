{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-bold mb-4">Devices</h1>
<ul class="space-y-2">
  {% for d in devices %}
  <li class="bg-white p-3 rounded shadow">
    <div class="font-semibold">{{ d.name }}</div>
    <div class="text-sm text-gray-600">{{ d.description }}</div>
  </li>
  {% endfor %}
</ul>
{% endblock %}
