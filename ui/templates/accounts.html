{% extends "base.html" %}
{% block content %}

<h1 class="text-xl font-bold mb-4">Accounts</h1>

<!-- Create Account Button -->
<a href="/ui/accounts/create"
   class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 px-4 py-2 inline-block">
  Create Account
</a>


<!-- Accounts Table -->
<div class="mt-4 overflow-x-auto">
  <table class="min-w-full bg-white border border-gray-300 rounded">
    <thead class="bg-gray-100 border-b">
      <tr>
        <th class="px-4 py-2 text-left">Username</th>
        <th class="px-4 py-2 text-left">Role</th>
        <th class="px-4 py-2 text-left">Actions</th>
      </tr>
    </thead>

    <tbody id="accounts-table">
      {% include "partials/accounts_table.html" %}
    </tbody>
  </table>
</div>

<!-- HTMX Modal Container (used only for Create + Delete confirm) -->
<div id="modal"></div>

{% endblock %}
